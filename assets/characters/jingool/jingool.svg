<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Shared silhouette: an asymmetric soft spark-blob, one side a little larger,
       gently floating. No animal features, no clothing. -->
  <symbol id="jingool-body" viewBox="0 0 200 200">
    <path d="M108 48 C136 48 156 58 164 76 C171 94 174 114 162 132 C152 148 136 158 116 160 C102 161 90 157 78 149 C62 139 52 122 50 106 C48 90 52 72 62 60 C71 50 88 46 108 48 Z" fill="var(--jg-body,#D9A441)" stroke="var(--jg-outline,#5A4B35)" stroke-width="3" stroke-linejoin="round"/>
  </symbol>

  <!-- Luminous core: a soft warm halo plus the brighter inner light. The light is
       conveyed by shape and color only (no gradients, no glow filters). -->
  <symbol id="jingool-core" viewBox="0 0 200 200">
    <path d="M110 101 C126 101 138 110 138 123 C138 135 127 144 111 144 C97 144 87 136 85 125 C83 115 90 106 97 102 C101 100 106 101 110 101 Z" fill="var(--jg-body-2,#EBCB78)"/>
    <path d="M110 110 C120 110 129 117 129 126 C129 135 121 141 110 141 C101 141 94 136 93 129 C92 122 96 115 101 112 C104 110 107 110 110 110 Z" fill="var(--jg-core,#FFE8A3)"/>
    <path d="M100 114 C104 111 109 110 114 111 C109 114 105 117 102 121 C101 118 100 116 100 114 Z" fill="#FFF3D6" opacity=".95"/>
  </symbol>

  <!-- Tiny nub arms, relaxed at the sides -->
  <symbol id="jingool-arms-idle" viewBox="0 0 200 200">
    <path d="M57 120 C 47 125 41 134 40 142" stroke="var(--jg-outline,#5A4B35)" stroke-width="15" stroke-linecap="round" fill="none"/>
    <path d="M57 120 C 47 125 41 134 40 142" stroke="var(--jg-body,#D9A441)" stroke-width="9" stroke-linecap="round" fill="none"/>
    <path d="M161 124 C 171 129 177 137 178 145" stroke="var(--jg-outline,#5A4B35)" stroke-width="15" stroke-linecap="round" fill="none"/>
    <path d="M161 124 C 171 129 177 137 178 145" stroke="var(--jg-body,#D9A441)" stroke-width="9" stroke-linecap="round" fill="none"/>
  </symbol>

  <!-- Arms flared open (excited / delighted) -->
  <symbol id="jingool-arms-out" viewBox="0 0 200 200">
    <path d="M62 96 C 48 90 36 82 30 74" stroke="var(--jg-outline,#5A4B35)" stroke-width="15" stroke-linecap="round" fill="none"/>
    <path d="M62 96 C 48 90 36 82 30 74" stroke="var(--jg-body,#D9A441)" stroke-width="9" stroke-linecap="round" fill="none"/>
    <path d="M156 96 C 170 90 182 82 188 74" stroke="var(--jg-outline,#5A4B35)" stroke-width="15" stroke-linecap="round" fill="none"/>
    <path d="M156 96 C 170 90 182 82 188 74" stroke="var(--jg-body,#D9A441)" stroke-width="9" stroke-linecap="round" fill="none"/>
  </symbol>

  <!-- Arms raised high (celebration) -->
  <symbol id="jingool-arms-up" viewBox="0 0 200 200">
    <path d="M80 90 C 68 74 62 58 66 44" stroke="var(--jg-outline,#5A4B35)" stroke-width="15" stroke-linecap="round" fill="none"/>
    <path d="M80 90 C 68 74 62 58 66 44" stroke="var(--jg-body,#D9A441)" stroke-width="9" stroke-linecap="round" fill="none"/>
    <path d="M140 90 C 152 74 158 58 154 44" stroke="var(--jg-outline,#5A4B35)" stroke-width="15" stroke-linecap="round" fill="none"/>
    <path d="M140 90 C 152 74 158 58 154 44" stroke="var(--jg-body,#D9A441)" stroke-width="9" stroke-linecap="round" fill="none"/>
  </symbol>

  <!-- Small motion dashes (pop: just appeared) -->
  <symbol id="jingool-motion" viewBox="0 0 200 200">
    <path d="M78 172 q -8 8 -20 6" stroke="var(--jg-outline,#5A4B35)" stroke-width="3" fill="none" stroke-linecap="round" opacity=".6"/>
    <path d="M142 172 q 8 8 20 6" stroke="var(--jg-outline,#5A4B35)" stroke-width="3" fill="none" stroke-linecap="round" opacity=".6"/>
    <circle cx="52" cy="66" r="3" fill="var(--jg-outline,#5A4B35)" opacity=".45"/>
    <circle cx="164" cy="56" r="2.4" fill="var(--jg-outline,#5A4B35)" opacity=".35"/>
  </symbol>

  <!-- Default: calm, soft open eyes, a little smile -->
  <symbol id="jingool-default" viewBox="0 0 200 200">
    <use href="#jingool-body"/>
    <use href="#jingool-core"/>
    <use href="#jingool-arms-idle"/>
    <ellipse cx="96" cy="84" rx="8" ry="8.6" fill="var(--jg-white,#FBF6EA)" stroke="var(--jg-outline,#5A4B35)" stroke-width="2.2"/>
    <ellipse cx="127" cy="84.5" rx="7.6" ry="8.2" fill="var(--jg-white,#FBF6EA)" stroke="var(--jg-outline,#5A4B35)" stroke-width="2.2"/>
    <circle cx="96" cy="85" r="3.4" fill="var(--jg-face,#332D29)"/>
    <circle cx="127" cy="85.5" r="3.2" fill="var(--jg-face,#332D29)"/>
    <circle cx="94.6" cy="83.6" r="1.2" fill="#fff"/>
    <circle cx="125.6" cy="84.1" r="1.1" fill="#fff"/>
    <path d="M104 99 Q 111 104 118 99" stroke="var(--jg-face,#332D29)" stroke-width="2.8" fill="none" stroke-linecap="round"/>
  </symbol>

  <!-- Delighted: happy closed arcs, clear open smile, brighter core -->
  <symbol id="jingool-delighted" viewBox="0 0 200 200">
    <use href="#jingool-body"/>
    <use href="#jingool-core" transform="translate(110 122) scale(1.12) translate(-110 -122)"/>
    <use href="#jingool-arms-out"/>
    <path d="M88 84 Q 96 75 104 84" stroke="var(--jg-face,#332D29)" stroke-width="4.5" fill="none" stroke-linecap="round"/>
    <path d="M119 84.5 Q 127 76 135 84.5" stroke="var(--jg-face,#332D29)" stroke-width="4.5" fill="none" stroke-linecap="round"/>
    <path d="M98 97 Q 111 115 124 97 Q 111 105 98 97 Z" fill="var(--jg-face,#332D29)" stroke="var(--jg-outline,#5A4B35)" stroke-width="1.6" stroke-linejoin="round"/>
  </symbol>

  <!-- Excited: wide bright eyes, body leaning, arms flared, ready to jump -->
  <symbol id="jingool-excited" viewBox="0 0 200 200">
    <g transform="rotate(-6 110 120)">
      <use href="#jingool-body"/>
      <use href="#jingool-core" transform="translate(110 122) scale(1.2) translate(-110 -122)"/>
      <use href="#jingool-arms-out"/>
      <ellipse cx="95" cy="82" rx="9.5" ry="10.5" fill="var(--jg-white,#FBF6EA)" stroke="var(--jg-outline,#5A4B35)" stroke-width="2.2"/>
      <ellipse cx="128" cy="82" rx="9" ry="10" fill="var(--jg-white,#FBF6EA)" stroke="var(--jg-outline,#5A4B35)" stroke-width="2.2"/>
      <circle cx="95" cy="83.5" r="4.2" fill="var(--jg-face,#332D29)"/>
      <circle cx="128" cy="83.5" r="4" fill="var(--jg-face,#332D29)"/>
      <circle cx="93.4" cy="81.8" r="1.5" fill="#fff"/>
      <circle cx="126.4" cy="81.8" r="1.4" fill="#fff"/>
      <path d="M101 100 Q 111 109 121 100 Q 111 106 101 100 Z" fill="var(--jg-face,#332D29)"/>
    </g>
  </symbol>

  <!-- Mischievous: one open eye, one squint, sly smile, a raised brow -->
  <symbol id="jingool-mischievous" viewBox="0 0 200 200">
    <use href="#jingool-body"/>
    <use href="#jingool-core" transform="translate(110 122) scale(.95) translate(-110 -122)"/>
    <use href="#jingool-arms-idle"/>
    <path d="M80 72 Q 88 66 96 71" stroke="var(--jg-face,#332D29)" stroke-width="3.4" fill="none" stroke-linecap="round"/>
    <ellipse cx="96" cy="85" rx="7.6" ry="8.4" fill="var(--jg-white,#FBF6EA)" stroke="var(--jg-outline,#5A4B35)" stroke-width="2.2"/>
    <circle cx="96" cy="86" r="3.2" fill="var(--jg-face,#332D29)"/>
    <circle cx="94.7" cy="84.7" r="1.1" fill="#fff"/>
    <path d="M122 80 Q 130 86 135 82" stroke="var(--jg-face,#332D29)" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M100 99 Q 112 104 124 95" stroke="var(--jg-face,#332D29)" stroke-width="2.8" fill="none" stroke-linecap="round"/>
  </symbol>

  <!-- Surprised: wide round eyes, tiny pupils, little o mouth, bright core -->
  <symbol id="jingool-surprised" viewBox="0 0 200 200">
    <use href="#jingool-body"/>
    <use href="#jingool-core" transform="translate(110 122) scale(1.16) translate(-110 -122)"/>
    <use href="#jingool-arms-idle"/>
    <path d="M84 70 Q 96 62 108 70 M112 70 Q 124 62 136 70" stroke="var(--jg-outline,#5A4B35)" stroke-width="2.6" fill="none" stroke-linecap="round"/>
    <circle cx="96" cy="84" r="10" fill="var(--jg-white,#FBF6EA)" stroke="var(--jg-outline,#5A4B35)" stroke-width="2.2"/>
    <circle cx="127" cy="84" r="9.4" fill="var(--jg-white,#FBF6EA)" stroke="var(--jg-outline,#5A4B35)" stroke-width="2.2"/>
    <circle cx="96" cy="84" r="2.4" fill="var(--jg-face,#332D29)"/>
    <circle cx="127" cy="84" r="2.2" fill="var(--jg-face,#332D29)"/>
    <ellipse cx="111" cy="103" rx="4" ry="5.5" fill="var(--jg-face,#332D29)"/>
  </symbol>

  <!-- Proud: calm satisfied arcs, small smile, head lifted, steady bright core -->
  <symbol id="jingool-proud" viewBox="0 0 200 200">
    <g transform="rotate(3 110 120)">
      <use href="#jingool-body"/>
      <use href="#jingool-core" transform="translate(110 122) scale(1.05) translate(-110 -122)"/>
      <use href="#jingool-arms-idle"/>
      <path d="M88 84 Q 96 76 104 84" stroke="var(--jg-face,#332D29)" stroke-width="4.2" fill="none" stroke-linecap="round"/>
      <path d="M119 84.5 Q 127 77 135 84.5" stroke="var(--jg-face,#332D29)" stroke-width="4.2" fill="none" stroke-linecap="round"/>
      <path d="M105 98 Q 111 103 117 98" stroke="var(--jg-face,#332D29)" stroke-width="2.8" fill="none" stroke-linecap="round"/>
    </g>
  </symbol>

  <!-- Sleepy: droopy lids, tiny yawn, soft dim core, body relaxing down -->
  <symbol id="jingool-sleepy" viewBox="0 0 200 200">
    <g transform="rotate(4 110 120)">
      <use href="#jingool-body"/>
      <use href="#jingool-core" transform="translate(110 126) scale(.85) translate(-110 -126)" opacity=".9"/>
      <use href="#jingool-arms-idle"/>
      <path d="M88 88 Q 96 95 104 88" stroke="var(--jg-face,#332D29)" stroke-width="4" fill="none" stroke-linecap="round"/>
      <path d="M119 88.5 Q 127 95 135 88.5" stroke="var(--jg-face,#332D29)" stroke-width="4" fill="none" stroke-linecap="round"/>
      <ellipse cx="111" cy="102" rx="3" ry="3.6" fill="var(--jg-face,#332D29)"/>
      <path d="M142 56 l6 6 h-6 l6 6" stroke="var(--jg-outline,#5A4B35)" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity=".7"/>
    </g>
  </symbol>

  <!-- Celebrating: the signature state — arms up, joyful arcs, big smile, biggest core -->
  <symbol id="jingool-celebrating" viewBox="0 0 200 200">
    <use href="#jingool-body"/>
    <use href="#jingool-core" transform="translate(110 122) scale(1.3) translate(-110 -122)"/>
    <use href="#jingool-arms-up"/>
    <path d="M87 84 Q 96 74 105 84" stroke="var(--jg-face,#332D29)" stroke-width="4.6" fill="none" stroke-linecap="round"/>
    <path d="M118 84.5 Q 127 75 136 84.5" stroke="var(--jg-face,#332D29)" stroke-width="4.6" fill="none" stroke-linecap="round"/>
    <path d="M98 97 Q 111 117 124 97 Q 111 108 98 97 Z" fill="var(--jg-face,#332D29)" stroke="var(--jg-outline,#5A4B35)" stroke-width="1.6" stroke-linejoin="round"/>
    <circle cx="50" cy="52" r="3.4" fill="var(--jg-body-2,#EBCB78)"/>
    <circle cx="166" cy="44" r="2.8" fill="var(--jg-body-2,#EBCB78)"/>
    <circle cx="178" cy="70" r="2.2" fill="var(--jg-body-2,#EBCB78)"/>
  </symbol>
</svg>
